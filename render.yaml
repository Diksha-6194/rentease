databases:
  - name: rentease-db
    databaseName: rentease
    user: rentease_user
    plan: free

services:
  - type: web
    name: rentease-backend
    env: python
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn rentease_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "rentease-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-app-url.vercel.app"
      # IMPORTANT: Add your CLOUDINARY_URL and STRIPE keys in the Render Dashboard
      - key: PYTHON_VERSION
        value: "3.9.0"
